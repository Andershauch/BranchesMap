name: Jobindsats v3 verification

on:
  push:
    branches: [fix/jobindsats-v3-import]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: branchesmap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d branchesmap_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/branchesmap_test?schema=public
      AUTH_SECRET: ci-only-auth-secret-not-used-for-deployments
      APP_BASE_URL: http://localhost:3000
      ENABLE_LIVE_JOB_ESTIMATES: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Prepare test database
        run: npm run db:push

      - name: Verify application
        run: npm run verify:ci

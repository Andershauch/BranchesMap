name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: branches_map_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d branches_map_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/branches_map_ci
      AUTH_SECRET: ci-only-auth-secret-not-used-for-deployments
      APP_BASE_URL: http://localhost:3000
      ENABLE_LIVE_JOB_ESTIMATES: "false"
      RUN_DB_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:push
      - run: npm run verify:ci
